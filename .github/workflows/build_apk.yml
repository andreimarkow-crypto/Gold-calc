name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Check and build
      run: |
        # Проверяем, не лежат ли файлы внутри вложенной папки
        if [ ! -f "build.gradle" ]; then
          NESTED_DIR=$(find . -maxdepth 2 -name "build.gradle" -exec dirname {} \;)
          if [ -n "$NESTED_DIR" ]; then
            echo "Файлы найдены во вложенной папке: $NESTED_DIR. Переходим туда..."
            cd "$NESTED_DIR"
          fi
        fi
        gradle assembleDebug --stacktrace

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: GoldCalculator-APK
        path: |
          **/build/outputs/apk/debug/*.apk
